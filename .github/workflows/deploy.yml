name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/saas/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend/saas
          npm ci

      - name: Build Next.js App
        run: |
          cd frontend/saas
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ORCHARD_URL: ${{ secrets.NEXT_PUBLIC_ORCHARD_URL }}

      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}
            git pull origin main
            npm ci --omit=dev
            npm run build
            # Hostinger automatically restarts the Node.js app

      - name: Deployment Failed
        if: failure()
        run: echo "Deployment to Hostinger failed. Check logs above."
